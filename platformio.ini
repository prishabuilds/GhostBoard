; ╔═══════════════════════════════════════════════╗
; ║        GhostBoard — PlatformIO Config         ║
; ╚═══════════════════════════════════════════════╝
;
; Build with:  pio run
; Upload with: pio run --target upload
; Monitor:     pio device monitor --baud 115200

[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino

; Serial monitor baud rate
monitor_speed = 115200

; Source files — include all subdirectories
src_filter    =
    +<*>
    +<config/>
    +<tasks/>
    +<recovery/>
    +<monitoring/>
    +<drivers/>
    +<ui/>

; Required libraries
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.5

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_FREERTOS_HZ=1000
    -std=gnu++17

; Partition scheme with more app space (no OTA needed)
board_build.partitions = no_ota.csv

; Upload settings
upload_speed  = 921600
